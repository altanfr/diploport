name: Diploport

on:
  schedule:
    - cron: "7 */3 * * *"        # her 3 saatte bir (UTC). Paylaşım saatlerini config.yaml belirler.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu: hiçbir şey kaydetme/paylaşma, sadece ne yapacağını raporla"
        type: boolean
        default: false
      photo_test:
        description: "Fotoğraf denemesi: 3 örnek kartı gerçek stok fotoğrafla üret (data/photo_test/), ilan taraması yapma"
        type: boolean
        default: false

concurrency:
  group: diploport
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      MAKE_SECRET: ${{ secrets.MAKE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fotoğraf denemesi (sadece photo_test işaretliyse)
        if: ${{ inputs.photo_test }}
        run: |
          python -m diploport phototest
          git config user.name "diploport-bot"
          git config user.email "diploport-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "veri: fotoğraf denemesi"
            git pull --rebase
            git push
          fi

      - name: 1) Tara, yargıla, sıradaki ilanın görselini hazırla
        if: ${{ !inputs.photo_test }}
        run: python -m diploport run

      - name: Değişiklikleri kaydet (görsel + site yayına girsin)
        if: ${{ !inputs.photo_test }}
        run: |
          git config user.name "diploport-bot"
          git config user.email "diploport-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "veri: tarama sonucu"
            git pull --rebase
            git push
          fi

      - name: 2) Instagram'a gönder (Make webhook)
        if: ${{ !inputs.photo_test }}
        run: python -m diploport send

      - name: Gönderim durumunu kaydet
        if: ${{ !inputs.photo_test }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "veri: gönderim durumu"
            git pull --rebase
            git push
          fi

      - name: Hata olursa Telegram'a haber ver
        if: failure()
        run: |
          python -m diploport alert "Diploport çalışması hata verdi - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
